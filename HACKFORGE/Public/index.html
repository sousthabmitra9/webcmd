<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Seeker Agent</title><link rel="stylesheet" href="style.css"></head><body><main><p class="kicker">WEBCMD-READY · RESUME-AWARE JOB SEARCH</p><h1>Find jobs that fit your resume.</h1><p>Public listings are ranked by your skills and preferences. Use Webcmd to inspect the original company page before applying.</p><form id="f"><label>Resume text<textarea id="resume" required placeholder="Paste skills, education, experience, and projects…"></textarea></label><section><label>Target roles<input id="titles" placeholder="Data Analyst, Python Developer"></label><label>Location<input id="location" placeholder="India, Bengaluru"></label></section><label class="check"><input id="remote" type="checkbox"> Remote roles only</label><button>Search jobs</button></form><p id="status"></p><div id="summary"></div><div id="results"></div><footer>Enabled sources: Remotive and Arbeitnow. Salary is shown only where the listing publishes it.</footer></main><script src="app.js"></script></body></html>
